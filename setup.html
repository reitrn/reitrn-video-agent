<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>reitrn Video Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:      #0F172A;
      --teal:     #00C4A7;
      --teal-dim: #00A389;
      --muted:    #64748B;
      --border:   #E2E8F0;
      --surface:  #F8FAFC;
      --white:    #FFFFFF;
      --alert:    #EF4444;
      --green:    #10B981;
      --radius:   10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
      user-select: none;
      overflow: hidden;
      height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--white);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px 16px;
    }
    .wordmark {
      font-family: 'Inter', sans-serif;
      font-size: 34px;
      letter-spacing: -1.5px;
      line-height: 1;
    }
    .wordmark .black { font-weight: 900; color: var(--ink); }
    .wordmark .teal  { font-weight: 900; color: var(--teal); }
    .wordmark-sub {
      font-family: 'Inter', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--teal);
      text-transform: uppercase;
      margin-top: 5px;
    }

    /* ── Body ── */
    .body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ── Card ── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .card-label {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* ── Fields ── */
    .field { margin-bottom: 10px; }
    .field:last-child { margin-bottom: 0; }

    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      background: var(--surface);
      outline: none;
      font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    }
    input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 2px #00c4a720;
    }

    /* ── Actions ── */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn {
      flex: 1;
      padding: 9px 16px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn-teal {
      background: var(--teal);
      color: var(--white);
    }
    .btn-teal:hover { background: var(--teal-dim); }

    .btn-surface {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      flex: 0 0 auto;
    }
    .btn-surface:hover { background: var(--border); }

    /* ── Status ── */
    #status {
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      min-height: 16px;
      color: var(--green);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: 10px;
      color: var(--border);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="wordmark">
      <span class="black">re</span><span class="teal">i</span><span class="black">trn</span><span class="teal">.</span>
    </div>
    <div class="wordmark-sub">video agent</div>
  </div>

  <!-- Settings card -->
  <div class="body">
    <div class="card">
      <div class="card-label">Configuration</div>

      <div class="field">
        <label>Watch folder</label>
        <input id="watchFolder" type="text" spellcheck="false" />
      </div>

      <div class="field">
        <label>reitrnhub URL</label>
        <input id="hubUrl" type="text" spellcheck="false" placeholder="https://hub.reitrn.com" />
      </div>

      <div class="field">
        <label>Agent key</label>
        <input id="agentKey" type="text" spellcheck="false" />
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-surface" id="open-folder">Open folder</button>
      <button class="btn btn-teal" id="save">Save &amp; Start</button>
    </div>

    <div id="status"></div>

    <div class="footer">reitrn. video agent v1.0.0</div>
  </div>

  <script>
    const { ipcRenderer, shell } = require('electron')

    ipcRenderer.invoke('get-config').then(cfg => {
      document.getElementById('watchFolder').value = cfg.watchFolder
      document.getElementById('hubUrl').value = cfg.reitrnHubUrl
      document.getElementById('agentKey').value = cfg.agentKey
    })

    document.getElementById('open-folder').addEventListener('click', () => {
      shell.openPath(document.getElementById('watchFolder').value.trim())
    })

    document.getElementById('save').addEventListener('click', () => {
      const watchFolder = document.getElementById('watchFolder').value.trim()
      const reitrnHubUrl = document.getElementById('hubUrl').value.trim().replace(/\/$/, '')
      const agentKey = document.getElementById('agentKey').value.trim()

      if (!watchFolder || !reitrnHubUrl || !agentKey) {
        const s = document.getElementById('status')
        s.textContent = 'All fields are required.'
        s.style.color = 'var(--alert)'
        return
      }

      ipcRenderer.send('save-config', { watchFolder, reitrnHubUrl, agentKey })
      const s = document.getElementById('status')
      s.textContent = 'Saved — starting agent…'
      s.style.color = 'var(--green)'
    })
  </script>
</body>
</html>
